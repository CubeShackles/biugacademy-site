    <title>Aprendizagem | BIU.G Academy</title>
    <link rel="icon" type="image/png" href="/assets/biug-academy-logo-160.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link

      <nav class="lang" aria-label="Idioma">

        <p lang="fr-FR">
          La connexion sécurisée nécessite JavaScript et un service d’API. Cette page statique
          n’authentifie personne.
        </p>

    <footer class="foot">
      <nav aria-label="Informação legal">
        <a class="foot-privacy" href="https://biugacademy.org/pt/privacidade/">Privacidade</a>
        <a class="foot-terms" href="https://biugacademy.org/pt/termos/">Termos de utilização</a>
