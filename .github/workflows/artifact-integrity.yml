name: Artifact integrity

# Bootstrap check. This pull_request workflow runs from the pull request's own
# tree, so it is NOT a trust anchor: it exists only to satisfy the currently
# required "Validate artifact" context for the bootstrap release PR, which is
# protected by an independent human approval. The trust anchor for every later
# pull request is artifact-integrity-trusted.yml (pull_request_target, policy
# pinned to the base commit). Retire this workflow once branch protection
# requires the trusted check instead (separate founder authorization).

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: artifact-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    permissions:
      contents: read
    steps:
      - name: Check out pull request merge tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test artifact path and exposure policy
        run: node .github/scripts/test-artifact-policy.mjs "$GITHUB_WORKSPACE"
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the complete checked-out repository for secrets
        run: "$RUNNER_TEMP/gitleaks dir --redact --no-banner --verbose $GITHUB_WORKSPACE"
      - name: Validate allowlist, content, links, and reproducible manifest
        run: node .github/scripts/validate-artifact.mjs "$GITHUB_WORKSPACE"
